runtime:
  require_linux: true
  require_cuda: true
  min_python: [3, 10]
  max_cuda_major: 13
model:
  name: openai/clip-vit-base-patch32
  dtype: float16
  local_files_only: true
scheduler:
  policy: edf_size
  deadline_tie_ms: 5.0
  quota_levels: [1.0]
  quota_policy: full
executor:
  streams: 2
  resource_backend: none
  allow_proxy_fallback: false
  libsmctrl_adapter: ""
profiling:
  table_path: data/profiles/default.csv
logging:
  output_dir: results
  request_log: requests.jsonl
seed: 20260902

metrics:
  # nvidia-smi 返回瞬时快照；0.1s 采样可在秒级实验中取得足够样本
  gpu_sample_interval_s: 0.1
