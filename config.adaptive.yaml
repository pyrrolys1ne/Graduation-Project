# 运行时并发度控制的一个可直接运行示例。
#
# 与 config.yaml 的唯一区别是 executor 段：
#   adaptive_concurrency: true  → 并发度由 ConcurrencyController 逐请求决定
#   streams: 2                  → 该字段被忽略（但仍须 ≥1，配置校验会检查）
#
# 用法（注意必须导出 LIBSMCTRL_PATH，否则掩码不可用时启动会被拒绝）：
#
#   export LIBSMCTRL_PATH=$HOME/.local/lib/libsmctrl/libsmctrl.so
#   encoder-sched-server --config config.adaptive.yaml --port 8000
#
# 对照实验不要直接跑这个文件——用 scripts/run_repeated_comparison.py --group concurrency，
# 它会同时跑静态扫描（streams=1/2/3/4/6/8）与动态臂，并给逐轮配对差。

runtime:
  require_linux: true
  require_cuda: true
  min_python: [3, 10]
  max_cuda_major: 13
model:
  name: openai/clip-vit-base-patch32
  dtype: float16
  local_files_only: true
scheduler:
  policy: multistream_fcfs
  deadline_tie_ms: 5.0
  quota_levels: [1.0]
  quota_policy: full
executor:
  streams: 2
  resource_backend: none
  allow_proxy_fallback: false
  libsmctrl_adapter: ""
  adaptive_concurrency: true
  concurrency:
    # 共驻度区间。max_concurrency 同时是 worker 池的铺满数量。
    min_concurrency: 1
    max_concurrency: 8
    # 等待队列以小请求（patch ≤ 100，即 224/336）为主时的共驻度。
    # 依据：剖析表里 224/336 的配额敏感性仅 1.34×/1.56×，SM 空转多
    # （demo_wave_quant 解析：224 平均空闲 72.5%），共驻可填空转。
    small_mix_concurrency: 6
    # 等待队列以大请求（patch ≥ 196，即 448/672）为主时的共驻度。
    # 依据：448/672 的敏感性 2.45×/2.12×，大请求自己就要吃满 SM 与带宽。
    large_mix_concurrency: 2
    small_mix_ratio: 0.5
    arrival_window_s: 0.5
    # 漂移回退：实测中位 / 预测中位 超过阈值即认为该尺寸的标定表不可信，
    # 此时不再用"大/小请求"做决策（那个区分本身依赖表）。这是本课题特色项。
    enable_drift_fallback: true
    drift_threshold: 1.5
    drift_min_samples: 8
profiling:
  table_path: data/profiles/default.csv
logging:
  output_dir: results
  request_log: requests.jsonl
seed: 20260902
metrics:
  gpu_sample_interval_s: 0.1
