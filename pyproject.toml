[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "encoder-sched"
version = "0.1.0"
description = "SLO-aware concurrent scheduling prototype for multimodal encoders"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pillow>=10,<13",
  "pydantic>=2.9,<3",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.5,<3",
  "transformers>=4.46,<5",
]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]
plot = ["matplotlib>=3.9,<4", "seaborn>=0.13,<1"]

[tool.setuptools.packages.find]
include = ["encoder_sched*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"
asyncio_mode = "auto"
